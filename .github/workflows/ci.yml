name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      run_gpu_tests:
        description: Run the hardware-dependent Vulkan GPU test matrix
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository and its history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check component boundaries
        run: >-
          cmake
          -DAYTHER_ROOT=${{ github.workspace }}
          -P tools/check_repo_boundary.cmake

      - name: Check documentation and license consistency
        shell: pwsh
        run: |
          ./tools/check_doc_references.ps1
          ./tools/dep_graph.ps1 -Check
          ./tools/gen_api_reference.ps1 -Check
          cmake -DAYTHER_REPO=${{ github.workspace }} -P tools/check_license.cmake

      - name: Check pull-request commit boundaries
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: >-
          ./tools/check_commit_boundary.ps1
          -Base '${{ github.event.pull_request.base.sha }}'
          -Head '${{ github.event.pull_request.head.sha }}'

  rust:
    name: Rust quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Cache Cargo inputs and outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust targets
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test Rust targets
        run: cargo test --workspace --all-targets --locked

      - name: Build Rust documentation
        run: cargo doc --workspace --no-deps --locked

      - name: Verify the Rust dependency notice
        shell: pwsh
        run: ./tools/gen_notice.ps1 -Check

  headless:
    name: Headless (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
            preset: linux-headless
          - platform: Windows
            os: windows-latest
            preset: windows-headless

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Cache Cargo inputs and outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-headless-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: |
            ${{ runner.os }}-headless-
            ${{ runner.os }}-cargo-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Install the core package
        run: >-
          cmake --install build/${{ matrix.preset }}
          --prefix '${{ runner.temp }}/ayther-install'

      - name: Retain CTest diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7

  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows native + package consumer
            os: windows-latest
            preset: windows-native
            compiler: clang-cl
            executable: ayther_package_consumer.exe
            install_subdir: windows-native
            needs_vpx: false
          - name: Linux native + package consumer
            os: ubuntu-latest
            preset: linux-native
            compiler: clang++
            executable: ayther_package_consumer
            install_subdir: linux-native
            needs_vpx: false
          - name: Linux native + VPX + package consumer
            os: ubuntu-latest
            preset: linux-native-vpx
            compiler: clang++
            executable: ayther_package_consumer
            install_subdir: linux-native-vpx
            needs_vpx: true
          - name: Windows native + VPX + package consumer
            os: windows-latest
            preset: windows-native-vpx
            compiler: clang-cl
            executable: ayther_package_consumer.exe
            install_subdir: windows-native-vpx
            needs_vpx: true

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Select the runner vcpkg installation
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw 'The runner did not provide VCPKG_INSTALLATION_ROOT.'
          }
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Linux VPX development files
        if: runner.os == 'Linux' && matrix.needs_vpx
        run: |
          sudo apt-get update
          sudo apt-get install --yes libvpx-dev pkg-config

      - name: Ensure NASM is available for Windows VPX
        if: runner.os == 'Windows' && matrix.needs_vpx
        shell: pwsh
        run: |
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm --yes --no-progress
            'C:\Program Files\NASM' |
              Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Build the pinned Windows VPX decoder
        if: runner.os == 'Windows' && matrix.needs_vpx
        shell: pwsh
        run: ./tools/build_libvpx.ps1

      - name: Cache Cargo inputs and outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'CMakeLists.txt', 'CMakePresets.json', 'vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.preset }}-
            ${{ runner.os }}-native-
            ${{ runner.os }}-cargo-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test native targets
        run: ctest --preset ${{ matrix.preset }}

      - name: Install the native package
        run: >-
          cmake --install build/${{ matrix.preset }}
          --prefix '${{ runner.temp }}/ayther-install/${{ matrix.install_subdir }}'

      - name: Configure the out-of-tree package consumer
        shell: pwsh
        run: >-
          cmake
          -S tests/package_consumer
          -B '${{ runner.temp }}/ayther-consumer/${{ matrix.install_subdir }}'
          -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DCMAKE_PREFIX_PATH='${{ runner.temp }}/ayther-install/${{ matrix.install_subdir }}'

      - name: Build the out-of-tree package consumer
        run: >-
          cmake --build
          '${{ runner.temp }}/ayther-consumer/${{ matrix.install_subdir }}'

      - name: Run the out-of-tree package consumer
        shell: pwsh
        run: >-
          & '${{ runner.temp }}/ayther-consumer/${{ matrix.install_subdir }}/${{ matrix.executable }}'

      - name: Retain CTest diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7

  gpu:
    name: GPU (${{ matrix.platform }}, opt-in)
    if: github.event_name == 'workflow_dispatch' && inputs.run_gpu_tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            preset: windows-native-gpu
          - platform: Linux
            os: ubuntu-latest
            preset: linux-native-gpu

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Select the runner vcpkg installation
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw 'The runner did not provide VCPKG_INSTALLATION_ROOT.'
          }
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Linux Vulkan runtime and virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes mesa-vulkan-drivers xvfb

      - name: Cache Cargo inputs and outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-native-gpu-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'CMakeLists.txt', 'CMakePresets.json', 'vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-native-gpu-
            ${{ runner.os }}-native-
            ${{ runner.os }}-cargo-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test GPU targets on Windows
        if: runner.os == 'Windows'
        run: ctest --preset ${{ matrix.preset }}

      - name: Test GPU targets on Linux
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum ctest --preset ${{ matrix.preset }}

      - name: Retain CTest diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7
