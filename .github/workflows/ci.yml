name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # Weekly: keeps main's vcpkg caches alive (Actions evicts a cache unused for
  # seven days), so the first push of every pull request finds them.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      run_gpu_tests:
        description: Run the hardware-dependent Vulkan GPU test matrix
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # On main (push or the weekly schedule) the vcpkg jobs only configure, which
  # saves main's vcpkg cache for the pull requests; nothing is built or tested.
  WARM_ONLY: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  CARGO_AUDIT_VERSION: 0.22.0
  CARGO_FUZZ_VERSION: 0.13.1
  CARGO_LLVM_COV_VERSION: 0.8.2
  FUZZ_NIGHTLY: nightly-2026-08-25
  CLANG_TIDY_VERSION: 18

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository and its history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check component boundaries
        run: >-
          cmake
          -DAYTHER_ROOT=${{ github.workspace }}
          -P tools/check_repo_boundary.cmake

      - name: Check documentation and license consistency
        shell: pwsh
        run: |
          ./tools/check_doc_references.ps1
          ./tools/dep_graph.ps1 -Check
          ./tools/gen_api_reference.ps1 -Check
          cmake -DAYTHER_REPO=${{ github.workspace }} -P tools/check_license.cmake

      - name: Test the coverage gate
        run: python3 -m unittest discover -s tests/coverage -p '*_test.py'

      - name: Check pull-request commit boundaries
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: >-
          ./tools/check_commit_boundary.ps1
          -Base '${{ github.event.pull_request.base.sha }}'
          -Head '${{ github.event.pull_request.head.sha }}'

  rust:
    name: Rust quality gates (${{ matrix.platform }})
    # A push to main replays the tree its pull request already validated
    # (the branch must be up to date to merge): this job does not run there.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
          - platform: Windows
            os: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Cache Cargo inputs and outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust targets
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test Rust targets
        run: cargo test --workspace --all-targets --locked

      - name: Install the pinned Rust dependency auditor
        if: runner.os == 'Linux'
        run: >-
          cargo install cargo-audit
          --version "${CARGO_AUDIT_VERSION}"
          --locked

      - name: Audit Rust dependencies
        if: runner.os == 'Linux'
        run: |
          cargo audit --deny warnings
          cargo audit --file fuzz/Cargo.lock --deny warnings

      - name: Build Rust documentation
        run: cargo doc --workspace --no-deps --locked

      - name: Verify the Rust dependency notice
        shell: pwsh
        run: ./tools/gen_notice.ps1 -Check

  headless:
    name: Headless (${{ matrix.platform }})
    # A push to main replays the tree its pull request already validated
    # (the branch must be up to date to merge): this job does not run there.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
            preset: linux-headless
          - platform: Windows
            os: windows-latest
            preset: windows-headless

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Cache Cargo inputs and outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-headless-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: |
            ${{ runner.os }}-headless-
            ${{ runner.os }}-cargo-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Install the core package
        run: >-
          cmake --install build/${{ matrix.preset }}
          --prefix '${{ runner.temp }}/ayther-install'

      - name: Retain CTest diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7

  sanitizers:
    name: ${{ matrix.name }}
    # A push to main replays the tree its pull request already validated
    # (the branch must be up to date to merge): this job only refreshes
    # the vcpkg cache there (WARM_ONLY).
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # One build instruments both: the CPU suite runs once instead of twice.
          - name: Linux native ASan + UBSan
            preset: linux-native-sanitizers
            runtime_options: >-
              ASAN_OPTIONS=detect_leaks=1:halt_on_error=1:strict_string_checks=1
              UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Select the runner vcpkg installation
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw 'The runner did not provide VCPKG_INSTALLATION_ROOT.'
          }
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # Each job reuses only its own built ports (system headers such as X11
          # are outside the ABI hash). vcpkg still checks each package's
          # ABI hash, so a stale archive is ignored, never linked.
          $binaryCache = Join-Path $env:RUNNER_TEMP 'vcpkg-binary-cache'
          New-Item -ItemType Directory -Force -Path $binaryCache | Out-Null
          "VCPKG_BINARY_SOURCES=clear;files,$binaryCache,readwrite" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ github.job }}-${{ matrix.preset || 'default' }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ github.job }}-${{ matrix.preset || 'default' }}-

      - name: Cache Cargo inputs and outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'CMakeLists.txt', 'CMakePresets.json', 'vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.preset }}-
            ${{ runner.os }}-native-
            ${{ runner.os }}-cargo-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        if: env.WARM_ONLY != 'true'
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Run CPU CTests under the sanitizer
        if: env.WARM_ONLY != 'true'
        shell: bash
        run: env ${{ matrix.runtime_options }} ctest --preset ${{ matrix.preset }}

      - name: Retain sanitizer diagnostics on failure
        if: env.WARM_ONLY != 'true' && (failure())
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14

  fuzz-smoke:
    name: Fuzz smoke
    # A push to main replays the tree its pull request already validated
    # (the branch must be up to date to merge): this job does not run there.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install the pinned fuzz toolchain
        run: |
          rustup toolchain install "${FUZZ_NIGHTLY}" --profile minimal
          cargo install cargo-fuzz --version "${CARGO_FUZZ_VERSION}" --locked

      - name: Exercise the seeded corpora
        run: |
          status=0
          for target in packs decoders ffi; do
            cargo +"${FUZZ_NIGHTLY}" fuzz run "$target" "fuzz/corpus/$target" -- -max_total_time=30 -max_len=1048576 -print_final_stats=1 || status=1
          done
          exit "$status"

      - name: Retain fuzz crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 30

  rust-coverage:
    name: Rust coverage gate
    # A push to main replays the tree its pull request already validated
    # (the branch must be up to date to merge): this job does not run there.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pinned Rust coverage tooling
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --version "${CARGO_LLVM_COV_VERSION}" --locked

      - name: Generate Rust coverage
        run: |
          mkdir -p coverage/rust
          cargo llvm-cov --workspace --all-targets --locked \
            --lcov --output-path coverage/rust/rust.lcov
          cargo llvm-cov report --summary-only | tee coverage/rust/summary.txt
          cargo llvm-cov report --html --output-dir coverage/rust/html

      - name: Enforce Rust coverage thresholds
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base_sha="${PR_BASE_SHA:-$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)}"
          python3 tools/check_coverage.py \
            --component rust \
            --lcov coverage/rust/rust.lcov \
            --base "${base_sha}" \
            --output coverage/rust/gate.txt

      # Published even when the gate failed: the report naming the uncovered
      # files and line ranges is most useful on the run that went red.
      - name: Publish Rust coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-rust
          path: coverage/rust
          if-no-files-found: error
          retention-days: 14

  cpp-coverage:
    name: C++ coverage collection (Linux)
    # A push to main replays the tree its pull request already validated
    # (the branch must be up to date to merge): this job only refreshes
    # the vcpkg cache there (WARM_ONLY).
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select the runner vcpkg installation
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw 'The runner did not provide VCPKG_INSTALLATION_ROOT.'
          }
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # Each job reuses only its own built ports (system headers such as X11
          # are outside the ABI hash). vcpkg still checks each package's
          # ABI hash, so a stale archive is ignored, never linked.
          $binaryCache = Join-Path $env:RUNNER_TEMP 'vcpkg-binary-cache'
          New-Item -ItemType Directory -Force -Path $binaryCache | Out-Null
          "VCPKG_BINARY_SOURCES=clear;files,$binaryCache,readwrite" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ github.job }}-${{ matrix.preset || 'default' }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ github.job }}-${{ matrix.preset || 'default' }}-

      # Changed-line coverage includes the Vulkan backend. Exercise it through
      # Mesa's deterministic software device instead of excluding first-party
      # renderer code from the gate. Xorg headers must be present before vcpkg
      # builds SDL or its X11 video backend is compiled out.
      - name: Install coverage tools and headless GPU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            "llvm-${CLANG_TIDY_VERSION}" \
            libx11-dev libxcursor-dev libxext-dev libxfixes-dev libxft-dev \
            libxi-dev libxrandr-dev libxss-dev libxtst-dev \
            mesa-vulkan-drivers vulkan-tools vulkan-validationlayers xauth xvfb

      - name: Configure coverage build
        run: cmake --preset linux-native-coverage

      - name: Build coverage targets
        if: env.WARM_ONLY != 'true'
        run: cmake --build --preset linux-native-coverage

      - name: Run CPU CTests with LLVM profiles
        if: env.WARM_ONLY != 'true'
        shell: bash
        run: |
          mkdir -p build/linux-native-coverage/coverage-profiles
          LLVM_PROFILE_FILE='${{ github.workspace }}/build/linux-native-coverage/coverage-profiles/%m-%p.profraw' \
            ctest --preset linux-native-coverage

      - name: Run GPU CTests with LLVM profiles
        if: env.WARM_ONLY != 'true'
        shell: bash
        env:
          LLVM_PROFILE_FILE: ${{ github.workspace }}/build/linux-native-coverage/coverage-profiles/%m-%p.profraw
          SDL_VIDEODRIVER: offscreen
          SDL_VULKAN_LIBRARY: ${{ github.workspace }}/build/linux-native-coverage/vcpkg_installed/x64-linux/debug/lib/libvulkan.so
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          test -f "$SDL_VULKAN_LIBRARY"
          lavapipe_icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' -print -quit)"
          if [[ -z "$lavapipe_icd" ]]; then
            echo "Lavapipe ICD manifest not found; installed manifests:" >&2
            find /usr/share/vulkan/icd.d -maxdepth 1 -type f -print >&2
            exit 1
          fi
          export VK_DRIVER_FILES="$lavapipe_icd"
          export VK_ICD_FILENAMES="$lavapipe_icd"
          vulkaninfo --summary
          pwsh -File ./tools/check_gpu_matrix.ps1 \
            -Preset linux-native-coverage-gpu \
            -ReportFile coverage-gpu-report.md

      - name: Generate C++ coverage
        if: env.WARM_ONLY != 'true'
        shell: bash
        env:
          LLVM_TOOLS_VERSION: ${{ env.CLANG_TIDY_VERSION }}
        run: >-
          bash tools/collect_cpp_coverage.sh
          build/linux-native-coverage
          coverage/cpp

      # Retain the Linux profile for the combined cross-platform gate.
      - name: Publish C++ coverage
        if: env.WARM_ONLY != 'true' && (always())
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cpp
          path: |
            coverage/cpp
            coverage-gpu-report.md
          if-no-files-found: error
          retention-days: 14

  native:
    name: ${{ matrix.name }}
    # A push to main replays the tree its pull request already validated
    # (the branch must be up to date to merge): this job only refreshes
    # the vcpkg cache there (WARM_ONLY).
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux native + package consumer
            os: ubuntu-latest
            preset: linux-native
            compiler: clang++
            executable: ayther_package_consumer
            install_subdir: linux-native
            needs_vpx: false
            parallel: 2
          - name: Linux native + VPX + package consumer
            os: ubuntu-latest
            preset: linux-native-vpx
            compiler: clang++
            executable: ayther_package_consumer
            install_subdir: linux-native-vpx
            needs_vpx: true
            parallel: 2
          - name: Windows native + VPX + package consumer
            os: windows-2025-vs2026
            preset: windows-native-vpx
            compiler: clang-cl
            executable: ayther_package_consumer.exe
            install_subdir: windows-native-vpx
            needs_vpx: true
            # Parallel links race on shared files on the Windows runner
            # ("being used by another process"): keep one job.
            parallel: 1

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check out the pinned Tessera provider
        if: env.WARM_ONLY != 'true' && runner.os == 'Windows'
        uses: actions/checkout@v5
        with:
          repository: Ayther-Dev/AYTHER-Tessera
          ref: 3ac141f64da3e892e8a18af057e576a6a1438d10
          path: build/tessera-source
          persist-credentials: false

      - name: Build and install the pinned Tessera provider
        if: env.WARM_ONLY != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $source = Join-Path $PWD 'build/tessera-source'
          Push-Location $source
          try {
            ./tools/bootstrap-dependencies.ps1 -Download
            ./tools/bootstrap-backends.ps1 -Download -SelectedOnly
            ./tools/check.ps1 -Preset windows-release -Stage Configure -Jobs 1
            cmake --build build/windows-release --target tessera_core tessera_cli tessera_generate_fixture_roms tessera_audio_fixture_generator --parallel 1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cmake --install build/windows-release --prefix "$env:RUNNER_TEMP/tessera-install"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
          "TESSERA_PREFIX=$env:RUNNER_TEMP/tessera-install" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Select the runner vcpkg installation
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw 'The runner did not provide VCPKG_INSTALLATION_ROOT.'
          }
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # Each job reuses only its own built ports (system headers such as X11
          # are outside the ABI hash). vcpkg still checks each package's
          # ABI hash, so a stale archive is ignored, never linked.
          $binaryCache = Join-Path $env:RUNNER_TEMP 'vcpkg-binary-cache'
          New-Item -ItemType Directory -Force -Path $binaryCache | Out-Null
          "VCPKG_BINARY_SOURCES=clear;files,$binaryCache,readwrite" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ github.job }}-${{ matrix.preset || 'default' }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ github.job }}-${{ matrix.preset || 'default' }}-

      - name: Install Linux VPX development files
        if: runner.os == 'Linux' && matrix.needs_vpx
        run: |
          sudo apt-get update
          sudo apt-get install --yes libvpx-dev pkg-config

      - name: Ensure NASM and Make are available for Windows VPX
        if: runner.os == 'Windows' && matrix.needs_vpx
        shell: pwsh
        run: |
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm --yes --no-progress
            'C:\Program Files\NASM' |
              Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          choco install make --yes --no-progress
          $makeRoot = Join-Path $env:ChocolateyInstall 'lib\make\tools'
          $make = Get-ChildItem $makeRoot -Recurse -Filter make.exe |
            Select-Object -First 1
          if (-not $make) {
            throw "Chocolatey installed Make but make.exe is absent from $makeRoot."
          }
          "AYTHER_MAKE=$($make.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build the pinned Windows VPX decoder
        if: runner.os == 'Windows' && matrix.needs_vpx
        shell: pwsh
        run: ./tools/build_libvpx.ps1

      - name: Cache Cargo inputs and outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'CMakeLists.txt', 'CMakePresets.json', 'vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.preset }}-
            ${{ runner.os }}-native-
            ${{ runner.os }}-cargo-

      - name: Configure
        shell: pwsh
        run: |
          $nativeArgs = @()
          if ($env:TESSERA_PREFIX) {
            # The pack builder belongs to Engine. Build it before configuring
            # native tests, whose fixtures are deliberately absent from Git.
            cmake --preset ${{ matrix.preset }} -DAYTHER_ENABLE_TESSERA=OFF
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cmake --build "build/${{ matrix.preset }}" --target make_test_pack --parallel 1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $source = Join-Path $PWD 'build/tessera-source'
            $fixtures = Join-Path $source 'build/windows-release/native-fixtures'
            & (Join-Path $source 'tools/generate-native-fixtures.ps1') `
              -TesseraBuild (Join-Path $source 'build/windows-release') `
              -EnginePackTool (Join-Path $PWD "build/${{ matrix.preset }}/bin/make_test_pack.exe")
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ('${{ matrix.preset }}' -eq 'windows-native-vpx') {
              cmake --build (Join-Path $source 'build/windows-release') `
                --target tessera_megadrive_replay_test --parallel 1
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              ctest --test-dir (Join-Path $source 'build/windows-release') `
                -R '^integration.megadrive_replay$' --output-on-failure -j 1
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $evidenceRoot = Join-Path $source 'build/evidence/phase3-Release-OFF'
              $evidence = Get-ChildItem $evidenceRoot -Directory |
                Where-Object { Test-Path (Join-Path $_.FullName 'summary.json') } |
                Sort-Object LastWriteTime -Descending | Select-Object -First 1
              if (-not $evidence) { throw 'Tessera replay produced no phase 3 evidence.' }
              $nativeArgs += "-DAYTHER_TESSERA_PHASE3_EVIDENCE_DIR=$($evidence.FullName)"
            }
            $nativeArgs += '-DAYTHER_ENABLE_TESSERA=ON'
            $nativeArgs += "-DTessera_DIR=$env:TESSERA_PREFIX/lib/cmake/Tessera"
            $nativeArgs += "-DAYTHER_TESSERA_TEST_SOURCE_DIR=$source"
            $nativeArgs += "-DAYTHER_TESSERA_TEST_FIXTURE_DIR=$fixtures"
          }
          cmake --preset ${{ matrix.preset }} @nativeArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:TESSERA_PREFIX -and '${{ matrix.preset }}' -eq 'windows-native-vpx') {
            $registered = ctest --test-dir 'build/windows-native' -N `
              -R '^ayther.integration.tessera_checkpoint$'
            if ($LASTEXITCODE -ne 0 -or ($registered -join [Environment]::NewLine) -notmatch 'Total Tests: 1') {
              throw 'Native checkpoint CTest was omitted after fixture generation.'
            }
          }

      - name: Verify required audio QA CTest families
        if: env.WARM_ONLY != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & cmake `
              "-DQA_BUILD_DIRECTORY=$($PWD.Path)/build/${{ matrix.preset }}" `
              "-DQA_CTEST_COMMAND=$((Get-Command ctest -ErrorAction Stop).Source)" `
              '-DQA_REQUIRED_FAMILIES=audio_qa,unit,contract,integration,limits,fidelity,performance' `
              -P tools/check_ctest_families.cmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        if: env.WARM_ONLY != 'true'
        run: >-
          cmake --build --preset ${{ matrix.preset }}
          --parallel ${{ matrix.parallel }}

      - name: Install the pinned clang-tidy
        if: env.WARM_ONLY != 'true' && (matrix.preset == 'linux-native')
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            "clang-format-${CLANG_TIDY_VERSION}" \
            "clang-tidy-${CLANG_TIDY_VERSION}"

      - name: Check format and static analysis on modified C++ sources
        if: env.WARM_ONLY != 'true' && (matrix.preset == 'linux-native')
        shell: bash
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
          CLANG_FORMAT: clang-format-${{ env.CLANG_TIDY_VERSION }}
          CLANG_TIDY: clang-tidy-${{ env.CLANG_TIDY_VERSION }}
        run: |
          base_revision="${BASE_REVISION}"
          if [[ -z "${base_revision}" || "${base_revision}" =~ ^0+$ ]]; then
            base_revision="$(git rev-parse HEAD^)"
          fi
          bash tools/run_clang_tidy_changed.sh \
            "${base_revision}" \
            build/${{ matrix.preset }}

      - name: Test native targets
        if: env.WARM_ONLY != 'true'
        shell: pwsh
        run: |
          ctest --preset ${{ matrix.preset }} 2>&1 | Tee-Object -FilePath native-ctest.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/check_core_test_results.ps1 -LogPath native-ctest.log

      - name: Install the native package
        if: env.WARM_ONLY != 'true'
        run: >-
          cmake --install build/${{ matrix.preset }}
          --prefix '${{ runner.temp }}/ayther-install/${{ matrix.install_subdir }}'

      - name: Configure the out-of-tree package consumer
        if: env.WARM_ONLY != 'true'
        shell: pwsh
        run: |
          $providerArgs = @()
          if ($env:TESSERA_PREFIX) {
            $providerArgs += "-DTessera_DIR=$env:TESSERA_PREFIX/lib/cmake/Tessera"
            $providerArgs += '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL'
          }
          cmake `
            -S tests/package_consumer `
            -B '${{ runner.temp }}/ayther-consumer/${{ matrix.install_subdir }}' `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DCMAKE_FIND_USE_PACKAGE_REGISTRY=OFF `
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_PREFIX_PATH='${{ runner.temp }}/ayther-install/${{ matrix.install_subdir }}' `
            @providerArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build the out-of-tree package consumer
        if: env.WARM_ONLY != 'true'
        run: >-
          cmake --build
          '${{ runner.temp }}/ayther-consumer/${{ matrix.install_subdir }}'

      - name: Run the out-of-tree package consumer
        if: env.WARM_ONLY != 'true'
        shell: pwsh
        run: >-
          ./tools/run_package_consumer.ps1
          -Executable '${{ runner.temp }}/ayther-consumer/${{ matrix.install_subdir }}/${{ matrix.executable }}'
          -TimeoutSeconds 5
          -ForbiddenPath '${{ github.workspace }}'

      - name: Reject an incompatible installed package version
        if: env.WARM_ONLY != 'true'
        run: >-
          cmake
          -DAYTHER_PACKAGE_PREFIX='${{ runner.temp }}/ayther-install/${{ matrix.install_subdir }}'
          -P tests/package_consumer/check_incompatible.cmake

      - name: Collect Tessera-native C++ coverage on Windows
        if: env.WARM_ONLY != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $source = Join-Path $PWD 'build/tessera-source'
          $fixtures = Join-Path $source 'build/windows-release/native-fixtures'
          cmake --preset windows-native-coverage `
            -DAYTHER_ENABLE_TESSERA=ON `
            "-DTessera_DIR=$env:TESSERA_PREFIX/lib/cmake/Tessera" `
            "-DAYTHER_TESSERA_TEST_SOURCE_DIR=$source" `
            "-DAYTHER_TESSERA_TEST_FIXTURE_DIR=$fixtures"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/windows-native-coverage `
            --target ayther_tessera_session_test ayther_tessera_pack_test `
              ayther_tessera_presentation_test ayther_tessera_controls_test `
            --parallel 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pattern = '^ayther\.integration\.tessera_(session|pack|presentation|controls)_test$'
          $registered = ctest --test-dir build/windows-native-coverage -N -R $pattern
          if ($LASTEXITCODE -ne 0 -or ($registered -join [Environment]::NewLine) -notmatch 'Total Tests: 4') {
            throw 'Native coverage must register all four Tessera integration tests.'
          }
          New-Item -ItemType Directory -Force `
            -Path build/windows-native-coverage/coverage-profiles | Out-Null
          $env:LLVM_PROFILE_FILE = "$env:GITHUB_WORKSPACE/build/windows-native-coverage/coverage-profiles/%m-%p.profraw"
          ctest --test-dir build/windows-native-coverage -R $pattern --output-on-failure -j 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/collect_cpp_coverage_windows.ps1 `
            -BuildDirectory build/windows-native-coverage `
            -OutputDirectory coverage/cpp-windows

      - name: Publish Tessera-native C++ coverage
        if: env.WARM_ONLY != 'true' && runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cpp-windows
          path: coverage/cpp-windows/native.lcov
          if-no-files-found: error
          retention-days: 14

      - name: Retain CTest diagnostics on failure
        if: env.WARM_ONLY != 'true' && (failure())
        uses: actions/upload-artifact@v4
        with:
          name: ctest-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
            build/${{ matrix.preset }}/tests/tessera-evidence/tessera-native-summary.json
            build/${{ matrix.preset }}/tests/tessera-evidence/**/engine-*.stderr.log
          if-no-files-found: ignore
          retention-days: 7

  cpp-coverage-gate:
    name: C++ coverage gate
    if: env.WARM_ONLY != 'true'
    needs: [cpp-coverage, native]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: coverage-cpp
          path: coverage/input-linux
      - uses: actions/download-artifact@v4
        with:
          name: coverage-cpp-windows
          path: coverage/input-windows
      - name: Combine platform reports and enforce unchanged thresholds
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          linux_report="$(find coverage/input-linux -type f -name 'cpp.lcov' -print -quit)"
          windows_report="$(find coverage/input-windows -type f -name 'native.lcov' -print -quit)"
          test -n "$linux_report" && test -n "$windows_report"
          mkdir -p coverage/combined
          cat "$linux_report" "$windows_report" > coverage/combined/cpp.lcov
          base_sha="${PR_BASE_SHA:-$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)}"
          python3 tools/check_coverage.py \
            --component cpp \
            --lcov coverage/combined/cpp.lcov \
            --base "$base_sha" \
            --output coverage/combined/gate.txt
      - name: Publish combined C++ coverage gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cpp-combined
          path: coverage/combined
          if-no-files-found: ignore
          retention-days: 14

  required-ci:
    name: Required CI gate
    if: always()
    needs:
      - repository-policy
      - rust
      - headless
      - sanitizers
      - fuzz-smoke
      - rust-coverage
      - cpp-coverage
      - native
      - cpp-coverage-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every mandatory job
        shell: bash
        run: |
          results=(
            "repository-policy=${{ needs.repository-policy.result }}"
            "rust=${{ needs.rust.result }}"
            "headless=${{ needs.headless.result }}"
            "sanitizers=${{ needs.sanitizers.result }}"
            "fuzz-smoke=${{ needs.fuzz-smoke.result }}"
            "rust-coverage=${{ needs.rust-coverage.result }}"
            "cpp-coverage=${{ needs.cpp-coverage.result }}"
            "native=${{ needs.native.result }}"
            "cpp-coverage-gate=${{ needs.cpp-coverage-gate.result }}"
          )
          failed=0
          for result in "${results[@]}"; do
            printf '%s\n' "$result"
            # On main (push or schedule) the build jobs are skipped on purpose.
            if [[ "${{ env.WARM_ONLY }}" == true && "$result" == *=skipped ]]; then
              continue
            fi
            if [[ "$result" != *=success ]]; then
              failed=1
            fi
          done
          exit "$failed"

  gpu:
    name: GPU (${{ matrix.platform }}, opt-in)
    if: github.event_name == 'workflow_dispatch' && inputs.run_gpu_tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            preset: windows-native-gpu
          - platform: Linux
            os: ubuntu-latest
            preset: linux-native-gpu

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Select the runner vcpkg installation
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw 'The runner did not provide VCPKG_INSTALLATION_ROOT.'
          }
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # Each job reuses only its own built ports (system headers such as X11
          # are outside the ABI hash). vcpkg still checks each package's
          # ABI hash, so a stale archive is ignored, never linked.
          $binaryCache = Join-Path $env:RUNNER_TEMP 'vcpkg-binary-cache'
          New-Item -ItemType Directory -Force -Path $binaryCache | Out-Null
          "VCPKG_BINARY_SOURCES=clear;files,$binaryCache,readwrite" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ github.job }}-${{ matrix.preset || 'default' }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ github.job }}-${{ matrix.preset || 'default' }}-

      - name: Install Linux Vulkan runtime and virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libx11-dev libxcursor-dev libxext-dev libxfixes-dev libxft-dev \
            libxi-dev libxrandr-dev libxss-dev libxtst-dev \
            mesa-vulkan-drivers vulkan-tools vulkan-validationlayers xauth xvfb

      - name: Cache Cargo inputs and outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-native-gpu-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'CMakeLists.txt', 'CMakePresets.json', 'vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-native-gpu-
            ${{ runner.os }}-native-
            ${{ runner.os }}-cargo-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # The wrapper runs ctest, records which device and driver answered, and
      # fails when the suite was SKIPPED rather than executed. Calling ctest
      # directly would let a runner with no Vulkan device skip all eight
      # oracles, exit 0, and report a green GPU job that rendered nothing.
      - name: Test GPU targets on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./tools/check_gpu_matrix.ps1
          -Preset ${{ matrix.preset }}
          -ReportFile gpu-report-${{ matrix.preset }}.md

      - name: Test GPU targets on Linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          SDL_VIDEODRIVER: offscreen
          SDL_VULKAN_LIBRARY: ${{ github.workspace }}/build/${{ matrix.preset }}/vcpkg_installed/x64-linux/lib/libvulkan.so
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          test -f "$SDL_VULKAN_LIBRARY"
          lavapipe_icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' -print -quit)"
          if [[ -z "$lavapipe_icd" ]]; then
            echo "Lavapipe ICD manifest not found; installed manifests:" >&2
            find /usr/share/vulkan/icd.d -maxdepth 1 -type f -print >&2
            exit 1
          fi
          export VK_DRIVER_FILES="$lavapipe_icd"
          export VK_ICD_FILENAMES="$lavapipe_icd"
          vulkaninfo --summary
          pwsh -File ./tools/check_gpu_matrix.ps1 \
            -Preset ${{ matrix.preset }} \
            -ReportFile gpu-report-${{ matrix.preset }}.md

      # Uploaded whether the job passed or failed: the device, the driver, and
      # the list of anything omitted are the record this matrix exists to keep,
      # and they matter most on the run that went wrong.
      - name: Publish the GPU matrix record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-report-${{ matrix.preset }}
          path: gpu-report-${{ matrix.preset }}.md
          if-no-files-found: warn
          retention-days: 30

      - name: Retain CTest diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7
